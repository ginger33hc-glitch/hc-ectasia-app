<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CER-AI Sign in</title>
  <meta name="theme-color" content="#05090d">
  <style>
    :root{--navy:#173b57;--blue:#1f5e8c;--ink:#17212b;--muted:#66717d;--line:#d9e0e6;--bg:#f4f6f8;--red:#a31212}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px}
    .panel{width:min(100%,430px);background:#fff;border:1px solid var(--line);border-radius:14px;padding:28px;box-shadow:0 12px 36px rgba(23,59,87,.12)}
    h1{margin:0 0 5px;color:var(--navy);font-size:26px}.sub{margin:0 0 22px;color:var(--muted);font-size:13px}.field{margin:14px 0}.field label{display:block;font-weight:700;margin-bottom:6px;color:var(--navy)}
    input{width:100%;padding:11px;border:1px solid #b9c5ce;border-radius:7px;font-size:16px;background:#fff}input:focus{outline:2px solid #8ab6d3;outline-offset:1px}
    button{width:100%;padding:12px;border:0;border-radius:8px;background:var(--navy);color:#fff;font-weight:700;font-size:15px;cursor:pointer;margin-top:8px}button:disabled{opacity:.6;cursor:wait}
    .error{min-height:20px;margin-top:12px;color:var(--red);font-size:13px;font-weight:700}.note{margin-top:18px;padding-top:14px;border-top:1px solid var(--line);color:var(--muted);font-size:11px;line-height:1.45}
  </style>
</head>
<body>
  <main class="panel" aria-labelledby="title">
    <h1 id="title">CER-AI</h1>
    <p class="sub">Secure clinical workspace</p>
    <form id="loginForm" autocomplete="on">
      <div class="field"><label for="username">Username</label><input id="username" name="username" autocomplete="username" required maxlength="128"></div>
      <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
      <button id="submitButton" type="submit">Sign in</button>
      <div id="error" class="error" role="alert" aria-live="polite"></div>
    </form>
    <div class="note">Credentials are sent only to this CER-AI server over the active HTTPS session. The password is not stored in browser storage.</div>
  </main>
<script>
(() => {
  const allowedNext = new Set(["/", "/archive-ui"]);
  const params = new URLSearchParams(window.location.search);
  const requested = params.get("next") || "/";
  const next = allowedNext.has(requested) ? requested : "/";
  const form = document.getElementById("loginForm");
  const button = document.getElementById("submitButton");
  const error = document.getElementById("error");

  fetch("/auth/me", {credentials:"same-origin", cache:"no-store"}).then(response => {
    if (response.ok) window.location.replace(next);
  }).catch(() => {});

  form.addEventListener("submit", async event => {
    event.preventDefault();
    error.textContent = "";
    button.disabled = true;
    try {
      const response = await fetch("/auth/login", {
        method:"POST",
        credentials:"same-origin",
        cache:"no-store",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
          username:document.getElementById("username").value,
          password:document.getElementById("password").value
        })
      });
      if (!response.ok) {
        let message = "Sign-in failed.";
        try { const data = await response.json(); message = data.detail || message; } catch (_) {}
        throw new Error(message);
      }
      document.getElementById("password").value = "";
      window.location.replace(next);
    } catch (exc) {
      error.textContent = exc.message || "Sign-in failed.";
    } finally {
      button.disabled = false;
    }
  });
})();
</script>
</body>
</html>
