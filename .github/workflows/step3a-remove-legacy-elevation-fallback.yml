name: Step 3A remove legacy elevation fallback

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  clean:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: monday-clean-architecture
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Guard and remove obsolete elevation fallback fields
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast

          files = {
              'app.py': Path('app.py').read_text(),
              'pentacam_field_registry.py': Path('pentacam_field_registry.py').read_text(),
              'pentacam_targeted_reread.py': Path('pentacam_targeted_reread.py').read_text(),
              'reports.py': Path('reports.py').read_text(),
              'research_export.py': Path('research_export.py').read_text(),
              'tests/test_research_export.py': Path('tests/test_research_export.py').read_text(),
          }
          app = files['app.py']

          # Guard the exact obsolete pathway before editing.
          assert '"anterior_elevation_thinnest_um"' in app
          assert '"posterior_elevation_thinnest_um"' in app
          assert 'MAP_FALLBACK_NUMERIC_FIELDS = (' in app
          assert 'This fallback is limited to the explicitly marked anterior/posterior elevation' in app

          # Remove the two legacy fields from the canonical numeric schema.
          app = app.replace(
              '    "CKI", "IHD", "I_S", "KISA", "IHA", "Rmin_mm", "anterior_elevation_thinnest_um",\n'
              '    "posterior_elevation_thinnest_um", "thinnest_x_mm", "thinnest_y_mm",\n',
              '    "CKI", "IHD", "I_S", "KISA", "IHA", "Rmin_mm", "thinnest_x_mm", "thinnest_y_mm",\n',
              1,
          )
          old_fallback = '''MAP_FALLBACK_NUMERIC_FIELDS = (\n    # Only explicitly marked elevation-at-thinnest values remain permitted local-map fallbacks.\n    # Locked printed outputs such as Rmin, K values, BAD, PPI, ARTmax, and topometric indices\n    # must be read from their exact canonical labeled source or left unreadable.\n    "anterior_elevation_thinnest_um",\n    "posterior_elevation_thinnest_um",\n)\n'''
          assert old_fallback in app
          app = app.replace(old_fallback, 'MAP_FALLBACK_NUMERIC_FIELDS = ()\n', 1)
          app = app.replace('                    "anterior_elevation_thinnest_um": {"type": ["number", "null"]},\n', '', 1)
          app = app.replace('                    "posterior_elevation_thinnest_um": {"type": ["number", "null"]},\n', '', 1)
          app = app.replace(
              '                    "I_S", "KISA", "IHA", "Rmin_mm", "anterior_elevation_thinnest_um",\n'
              '                    "posterior_elevation_thinnest_um", "thinnest_x_mm", "thinnest_y_mm",\n',
              '                    "I_S", "KISA", "IHA", "Rmin_mm", "thinnest_x_mm", "thinnest_y_mm",\n',
              1,
          )
          old_prompt = '''If and only if the corresponding side/summary-table field is absent, obscured, or unreadable, a local\nmap number may be used as a second-priority fallback when it directly represents the same named\nmeasurement and that field is allowed by MAP_FALLBACK_NUMERIC_FIELDS. Record it in\nmap_fallback_numeric_fields and not in table_verified_numeric_fields. The marker/location and map\ntype must make the identity unambiguous. This fallback is limited to the explicitly marked anterior/posterior elevation\nat that same thinnest point. Rmin is never a map fallback. A generic curvature-map spot is not Kmax\nor Rmin. If the identity or location is uncertain, return null.\n'''
          assert old_prompt in app
          app = app.replace(
              old_prompt,
              'No numeric map fallback is permitted. If the authoritative labeled field is absent, obscured, or unreadable, return null. Never substitute a local map number, color-scale value, or neighboring measurement.\n',
              1,
          )
          app = app.replace('        "IHA": "max", "Rmin_mm": "min", "anterior_elevation_thinnest_um": "max",\n        "posterior_elevation_thinnest_um": "max", "RMS_HOA_um": "max", "vertical_coma_um": "max",\n',
                            '        "IHA": "max", "Rmin_mm": "min", "RMS_HOA_um": "max", "vertical_coma_um": "max",\n', 1)

          registry = files['pentacam_field_registry.py']
          registry = registry.replace('    "Rmin_mm", "anterior_elevation_thinnest_um",\n    "posterior_elevation_thinnest_um", "thinnest_x_mm", "thinnest_y_mm",\n',
                                      '    "Rmin_mm", "thinnest_x_mm", "thinnest_y_mm",\n', 1)

          reread = files['pentacam_targeted_reread.py']
          reread = reread.replace('        "anterior_elevation_thinnest_um": (("anteriorelevation", "frontelevation"), ("thin", "thinnest")),\n', '', 1)
          reread = reread.replace('        "posterior_elevation_thinnest_um": (("posteriorelevation", "backelevation"), ("thin", "thinnest")),\n', '', 1)

          reports = files['reports.py']
          reports = reports.replace('        ("Anterior elevation at TP", "anterior_elevation_thinnest_um", " um", 1),\n', '', 1)
          reports = reports.replace('        ("Posterior elevation at TP", "posterior_elevation_thinnest_um", " um", 1),\n', '', 1)

          research = files['research_export.py']
          research = research.replace('    "anterior_elevation_thinnest_um",\n', '', 1)
          research = research.replace('    "posterior_elevation_thinnest_um",\n', '', 1)
          research = research.replace('        "anterior_elevation_thinnest_um": raw_eye.get("anterior_elevation_thinnest_um"),\n', '', 1)
          research = research.replace('        "posterior_elevation_thinnest_um": raw_eye.get("posterior_elevation_thinnest_um"),\n', '', 1)

          research_test = files['tests/test_research_export.py']
          research_test = research_test.replace('                    "anterior_elevation_thinnest_um": 5,\n', '', 1)
          research_test = research_test.replace('                    "posterior_elevation_thinnest_um": 12,\n', '', 1)
          research_test = research_test.replace('                    "anterior_elevation_thinnest_um": 6,\n', '', 1)
          research_test = research_test.replace('                    "posterior_elevation_thinnest_um": 14,\n', '', 1)

          outputs = {
              'app.py': app,
              'pentacam_field_registry.py': registry,
              'pentacam_targeted_reread.py': reread,
              'reports.py': reports,
              'research_export.py': research,
              'tests/test_research_export.py': research_test,
          }
          for name,text in outputs.items():
              ast.parse(text) if name.endswith('.py') else None
              Path(name).write_text(text)

          # Post-cleanup invariants.
          for name in ('app.py','pentacam_field_registry.py','pentacam_targeted_reread.py','reports.py','research_export.py'):
              text = Path(name).read_text()
              assert 'anterior_elevation_thinnest_um' not in text, name
              assert 'posterior_elevation_thinnest_um' not in text, name
          assert 'MAP_FALLBACK_NUMERIC_FIELDS = ()' in Path('app.py').read_text()
          PY
      - name: Commit Step 3A cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app.py pentacam_field_registry.py pentacam_targeted_reread.py reports.py research_export.py tests/test_research_export.py
          git commit -m "Remove obsolete elevation map fallback fields"
          git push origin HEAD:monday-clean-architecture
