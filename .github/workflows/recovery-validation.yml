name: Recovery Clinical Validation

on:
  push:
    branches: [recovery/approved-rebuild]
  pull_request:
    branches: [recovery/ci-validation-base]

permissions:
  contents: read

jobs:
  recovery-validation:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
      OPENAI_API_KEY: test-key-for-import-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Critical static checks
        run: ruff check --select E9,F63,F7,F82 .
      - name: Compile recovery decision-critical modules
        run: python -m py_compile runtime_composition.py erss_topography_evidence_policy.py ps3_policy.py ps3_extraction_policy.py ps3_runtime_policy.py ps3_report_policy.py randleman_report_readiness_policy.py
      - name: Canonical startup invariants
        run: python -c "import canonical_engine; assert canonical_engine.runtime_invariants()"
      - name: Focused ERSS and reporting regressions
        run: >-
          python -m pytest -q
          tests/test_erss_runtime.py
          tests/test_behavior_lock_v0743.py
          tests/test_clean_end_to_end_equivalence.py
          tests/test_hc_engine.py::TestSafetyGates::test_prior_surgery_short_circuits_virgin_engine_even_if_thin
      - name: Full application regression suite
        run: python -m pytest -q
