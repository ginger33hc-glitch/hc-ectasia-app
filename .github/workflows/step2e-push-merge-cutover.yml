name: Step 2E push merge cutover

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  push-cutover:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: monday-clean-architecture
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Reuse guarded merge transformation without workflow-file mutation
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          text = Path('.github/workflows/step2e-flatten-merge-chain.yml').read_text()
          start = text.index("          python - <<'PY'\n") + len("          python - <<'PY'\n")
          end = text.index("\n          PY\n", start)
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in text[start:end].splitlines())
          subprocess.run(['python', '-c', script], check=True)
          # GitHub Actions App may not push workflow-file changes. CI is updated separately via Contents API.
          subprocess.run(['git', 'checkout', '--', '.github/workflows/canonical-runtime.yml'], check=True)
          PY
      - name: Commit direct canonical merge code
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app.py bootstrap.py extraction_guard.py runtime_composition.py canonical_engine.py merge_policy_base.py
          git commit -m "Flatten canonical extraction merge chain"
          git push origin HEAD:monday-clean-architecture
