name: Step 2D direct image extraction pipeline

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  flatten:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: monday-clean-architecture
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Guard and flatten per-image extraction pipeline
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast

          app_path = Path('app.py')
          targeted_path = Path('pentacam_targeted_reread.py')
          srax_path = Path('geometric_srax_policy.py')
          composition_path = Path('runtime_composition.py')
          engine_path = Path('canonical_engine.py')

          app = app_path.read_text(encoding='utf-8')
          targeted = targeted_path.read_text(encoding='utf-8')
          srax = srax_path.read_text(encoding='utf-8')
          composition = composition_path.read_text(encoding='utf-8')
          engine = engine_path.read_text(encoding='utf-8')

          # app.py owns the explicit per-image sequence.
          if 'import sys\n' not in app:
              if app.count('import os\n') != 1:
                  raise SystemExit('ABORT: app os import marker ambiguous')
              app = app.replace('import os\n', 'import os\nimport sys\n', 1)
          module_marker = 'from openai import OpenAI\n\n'
          module_imports = 'import pentacam_targeted_reread\nimport geometric_srax_policy\n\n'
          if module_imports not in app:
              if app.count(module_marker) != 1:
                  raise SystemExit('ABORT: app module import marker ambiguous')
              app = app.replace(module_marker, module_marker + module_imports, 1)

          return_old = '''        for eye in result.get("eyes", []):\n            eye["_source_filename"] = filename\n            eye["_pentacam_qs"] = context.get("pentacam_qs", "NOT_SHOWN")\n        return result\n'''
          return_new = '''        for eye in result.get("eyes", []):\n            eye["_source_filename"] = filename\n            eye["_pentacam_qs"] = context.get("pentacam_qs", "NOT_SHOWN")\n        result = pentacam_targeted_reread.enrich_extraction(\n            sys.modules[__name__], result, raw, filename\n        )\n        result = geometric_srax_policy.enrich_extraction(result, raw, filename)\n        return result\n'''
          if app.count(return_old) != 1:
              raise SystemExit(f'ABORT: app extraction return marker count={app.count(return_old)}')
          app = app.replace(return_old, return_new, 1)

          # Targeted reread remains a module of pure helpers plus one explicit enrichment function.
          cut = targeted.find('\ndef make_targeted_extractor(')
          if cut < 0:
              raise SystemExit('ABORT: targeted wrapper boundary missing')
          targeted_tail = '''\n\ndef enrich_extraction(\n    core: Any, result: dict[str, Any], raw: bytes, filename: str\n) -> dict[str, Any]:\n    """Run the targeted second pass explicitly after primary extraction."""\n    requested = missing_targets_by_eye(result)\n    patient_age_requested = patient_age_is_missing(result)\n    pentacam_qs_requested = pentacam_qs_is_missing(result)\n    if not _enabled() or (\n        not requested and not patient_age_requested and not pentacam_qs_requested\n    ):\n        return result\n    try:\n        reread = targeted_reread(\n            core, raw, filename, requested, patient_age_requested, pentacam_qs_requested,\n        )\n        return apply_targeted_readings(\n            core, result, reread, requested, filename, patient_age_requested,\n            pentacam_qs_requested,\n        )\n    except Exception as exc:\n        result.setdefault("global_warnings", []).append(\n            f"Targeted Pentacam numeric reread failed for {filename}: "\n            f"{type(exc).__name__}; original extraction retained."\n        )\n        return result\n'''
          targeted = targeted[:cut] + targeted_tail
          targeted = targeted.replace('from typing import Any, Callable\n', 'from typing import Any\n', 1)
          if 'def install(' in targeted or 'make_targeted_extractor' in targeted or '_previous_extract_one_image' in targeted:
              raise SystemExit('ABORT: targeted runtime wrapper survived')

          # Geometric SRAX keeps only the deterministic algorithm plus direct enrichment.
          cut = srax.find('\ndef make_geometric_srax_extractor(')
          if cut < 0:
              raise SystemExit('ABORT: geometric SRAX wrapper boundary missing')
          srax_tail = '''\n\ndef enrich_extraction(result: dict[str, Any], raw: bytes, filename: str) -> dict[str, Any]:\n    """Apply deterministic Front-map SRAX geometry explicitly to one extraction result."""\n    if not _enabled():\n        return result\n    eyes = [\n        eye for eye in result.get("eyes") or []\n        if eye.get("eye") in {"OD", "OS"} and _is_four_maps_eye(eye)\n    ]\n    if len(eyes) != 1:\n        return result\n    eye = eyes[0]\n    try:\n        measurement = measure_srax(raw)\n    except Exception as exc:\n        result.setdefault("global_warnings", []).append(\n            f"Geometric SRAX measurement failed for {filename}: {type(exc).__name__}; "\n            "SRAX remains unresolved."\n        )\n        eye["srax"] = "UNCERTAIN"\n        eye["srax_deg"] = None\n        return result\n\n    eye["srax_geometry"] = measurement\n    if measurement.get("status") != "CONFIDENT":\n        eye["srax"] = "UNCERTAIN"\n        eye["srax_deg"] = None\n        return result\n\n    eye["srax"] = measurement["srax"]\n    eye["srax_deg"] = measurement["srax_deg"]\n    eye.setdefault("morphology_evidence", []).append(\n        "Deterministic Front-map SRAX geometry "\n        f"({ALGORITHM_VERSION}): superior axis {measurement['superior_axis_deg']:.1f}°, "\n        f"inferior axis {measurement['inferior_axis_deg']:.1f}°, "\n        f"SRAX {measurement['srax_deg']:.1f}°; strict >20° criterion."\n    )\n    provenance = eye.setdefault("field_provenance", {})\n    provenance["srax"] = [\n        {"source": "AXIAL_SAGITTAL_CURVATURE_FRONT_GEOMETRIC", "file": filename}\n    ]\n    provenance["srax_deg"] = [\n        {"source": "AXIAL_SAGITTAL_CURVATURE_FRONT_GEOMETRIC", "file": filename}\n    ]\n    return result\n'''
          srax = srax[:cut] + srax_tail
          srax = srax.replace('from typing import Any, Callable\n', 'from typing import Any\n', 1)
          if 'def install(' in srax or 'make_geometric_srax_extractor' in srax or '_previous_extract_one_image' in srax:
              raise SystemExit('ABORT: geometric SRAX runtime wrapper survived')

          # Composition no longer owns per-image extraction behavior.
          for line in (
              'import pentacam_targeted_reread  # noqa: E402\n',
              'import geometric_srax_policy  # noqa: E402\n',
              '    pentacam_targeted_reread.install(core)\n',
              '    geometric_srax_policy.install(core)\n',
          ):
              if composition.count(line) != 1:
                  raise SystemExit(f'ABORT: composition line count for {line.strip()}={composition.count(line)}')
              composition = composition.replace(line, '', 1)
          composition = composition.replace(
              '        "mandatory_source_set_policy", "pentacam_targeted_reread",\n        "geometric_srax_policy",\n',
              '        "mandatory_source_set_policy",\n',
              1,
          )
          if 'pentacam_targeted_reread' in composition or 'geometric_srax_policy' in composition:
              raise SystemExit('ABORT: per-image wrapper names survived runtime composition')

          # Startup invariants require direct pipeline ownership and forbid installer APIs.
          import_marker = 'import canonical_runtime_service\n'
          direct_imports = 'import geometric_srax_policy\nimport pentacam_targeted_reread\n'
          if direct_imports not in engine:
              if engine.count(import_marker) != 1:
                  raise SystemExit('ABORT: canonical engine import marker ambiguous')
              engine = engine.replace(import_marker, import_marker + direct_imports, 1)
          for marker_line in (
              '        ("_cerai_targeted_pentacam_reread_installed", "Targeted Pentacam reread is not active"),\n',
              '        ("_cerai_geometric_srax_installed", "Geometric SRAX extraction is not active"),\n',
          ):
              if engine.count(marker_line) != 1:
                  raise SystemExit(f'ABORT: runtime marker invariant count={engine.count(marker_line)}')
              engine = engine.replace(marker_line, '', 1)
          invariant_marker = '''    if "srax_completion_policy" in phase_names or "randleman_report_readiness_policy" in phase_names:\n        errors.append("Retired workflow monkey-patch remains in production composition")\n\n'''
          direct_checks = '''    if "srax_completion_policy" in phase_names or "randleman_report_readiness_policy" in phase_names:\n        errors.append("Retired workflow monkey-patch remains in production composition")\n\n    extraction_source = inspect.getsource(core.extract_one_image)\n    if "pentacam_targeted_reread.enrich_extraction(" not in extraction_source:\n        errors.append("Targeted Pentacam reread is not directly owned by app.extract_one_image")\n    if "geometric_srax_policy.enrich_extraction(" not in extraction_source:\n        errors.append("Geometric SRAX is not directly owned by app.extract_one_image")\n    if callable(getattr(pentacam_targeted_reread, "install", None)):\n        errors.append("Targeted Pentacam reread must not expose a runtime installer")\n    if callable(getattr(geometric_srax_policy, "install", None)):\n        errors.append("Geometric SRAX must not expose a runtime installer")\n    if "pentacam_targeted_reread" in phase_names or "geometric_srax_policy" in phase_names:\n        errors.append("Per-image extraction wrapper remains in runtime composition")\n\n'''
          if engine.count(invariant_marker) != 1:
              raise SystemExit('ABORT: canonical invariant insertion marker ambiguous')
          engine = engine.replace(invariant_marker, direct_checks, 1)

          for text, name in (
              (app, 'app.py'), (targeted, 'pentacam_targeted_reread.py'),
              (srax, 'geometric_srax_policy.py'), (composition, 'runtime_composition.py'),
              (engine, 'canonical_engine.py'),
          ):
              ast.parse(text, filename=name)

          app_path.write_text(app, encoding='utf-8')
          targeted_path.write_text(targeted, encoding='utf-8')
          srax_path.write_text(srax, encoding='utf-8')
          composition_path.write_text(composition, encoding='utf-8')
          engine_path.write_text(engine, encoding='utf-8')
          PY
          python -m py_compile app.py pentacam_targeted_reread.py geometric_srax_policy.py runtime_composition.py canonical_engine.py
          git diff --check
      - name: Commit Step 2D direct image pipeline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py pentacam_targeted_reread.py geometric_srax_policy.py runtime_composition.py canonical_engine.py
          git commit -m "Flatten per-image extraction pipeline"
          git push origin HEAD:monday-clean-architecture
