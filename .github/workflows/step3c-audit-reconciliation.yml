name: Step 3C audit reconciliation paths

on:
  pull_request:
    branches: [main]
    types: [synchronize]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: monday-clean-architecture
          fetch-depth: 0
      - name: Locate reconciliation expectations
        run: |
          grep -RInE 'numeric_reconciliation|reconciled_multi_image_values|within.?1%|one_percent|numeric_tolerance|EXCLUSIVE_LABELED_BOX_FIELDS' --include='*.py' . || true
