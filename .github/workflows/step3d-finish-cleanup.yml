# trigger: retry after whitespace cleanup
name: Step 3D finish cleanup
on:
  pull_request:
    branches: [main]
    types: [synchronize]
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: monday-clean-architecture
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Remove dead visual constant and prompt text
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast
          p=Path('app.py')
          t=p.read_text()
          block='''MORPHOLOGY = (\n    "NORMAL_SYMMETRIC",\n    "ASYMMETRIC_BOWTIE",\n    "INFERIOR_STEEPENING_SRA",\n    "ABNORMAL_ECTATIC",\n    "UNCERTAIN",\n)\n'''
          if block not in t:
              raise SystemExit('MORPHOLOGY constant block not found exactly once')
          t=t.replace(block,'',1)
          sentence='Anterior/posterior tomography pattern fields remain separate non-ERSS review inputs.\n'
          if sentence not in t:
              raise SystemExit('obsolete pattern prompt sentence not found')
          t=t.replace(sentence,'',1)
          t='\n'.join(line.rstrip() for line in t.splitlines())+'\n'
          ast.parse(t)
          p.write_text(t)
          PY
          git diff --check
          python -m py_compile app.py
      - name: Commit Step 3D final cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py
          git diff --cached --quiet && exit 1
          git commit -m 'Finish retired visual path cleanup'
          git push origin HEAD:monday-clean-architecture
