name: Step 1 guarded app cleanup

on:
  push:
    branches: [monday-clean-architecture]
  pull_request:
    branches: [main]
    types: [synchronize]

# One-shot Step 1 trigger. Remove this workflow after successful guarded cleanup.
permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: monday-clean-architecture
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Guard and remove dormant legacy assessment engine
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast

          root = Path('.')
          app_path = root / 'app.py'
          text = app_path.read_text(encoding='utf-8')

          targets = {'assess_eye', 'hc_engine', 'apply_extracted_corrections'}
          production_refs = {}
          excluded_dirs = {'.git', '.github', 'tests', 'docs'}

          # Fail closed only on executable symbol references. String literals used by
          # architecture invariants (for example "core.hc_engine") are not callers.
          for path in root.rglob('*.py'):
              if path == app_path or any(part in excluded_dirs for part in path.parts):
                  continue
              source = path.read_text(encoding='utf-8')
              try:
                  tree = ast.parse(source, filename=str(path))
              except SyntaxError as exc:
                  raise SystemExit(f'ABORT: cannot AST-parse {path}: {exc}') from exc
              refs = set()
              for node in ast.walk(tree):
                  if isinstance(node, ast.Name) and isinstance(node.ctx, ast.Load) and node.id in targets:
                      refs.add(node.id)
                  elif isinstance(node, ast.Attribute) and isinstance(node.ctx, ast.Load) and node.attr in targets:
                      refs.add(node.attr)
              for name in refs:
                  production_refs.setdefault(name, []).append(str(path))
          if production_refs:
              raise SystemExit(f'ABORT: legacy functions still have executable production references: {production_refs}')

          old = '''    from nice_policy import attach_readings\n    from assessment_workflow import begin\n    import sys\n    extracted = attach_readings(merge_extractions(extraction_results), extraction_results)\n'''
          new = '''    from assessment_workflow import begin\n    import sys\n    extracted = merge_extractions(extraction_results)\n'''
          if old not in text:
              raise SystemExit('ABORT: expected legacy NICE attach-readings block not found exactly once')
          if text.count(old) != 1:
              raise SystemExit('ABORT: legacy NICE attach-readings block is ambiguous')
          text = text.replace(old, new)

          tree = ast.parse(text)
          nodes = {
              node.name: node
              for node in tree.body
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)) and node.name in targets
          }
          if set(nodes) != targets:
              raise SystemExit(f'ABORT: expected exact legacy functions not found: {targets - set(nodes)}')

          lines = text.splitlines(keepends=True)
          spans = sorted(
              ((node.lineno - 1, node.end_lineno, name) for name, node in nodes.items()),
              reverse=True,
          )
          for start, end, name in spans:
              del lines[start:end]
              if start < len(lines) and start > 0 and lines[start-1].strip() == '' and lines[start].strip() == '':
                  del lines[start]
          cleaned = ''.join(lines)
          ast.parse(cleaned)
          for name in targets:
              if f'def {name}(' in cleaned:
                  raise SystemExit(f'ABORT: {name} definition survived cleanup')
          if 'from nice_policy import attach_readings' in cleaned or 'attach_readings(' in cleaned:
              raise SystemExit('ABORT: legacy NICE attach-readings path survived cleanup')
          if 'def merge_extractions(' not in cleaned:
              raise SystemExit('ABORT: canonical extraction merge function was unexpectedly removed')
          app_path.write_text(cleaned, encoding='utf-8')
          PY
          python -m py_compile app.py
          git diff --check
      - name: Commit guarded cleanup
        run: |
          if git diff --quiet -- app.py; then
            echo "No app.py cleanup required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "Remove dormant legacy app clinical engine"
          git push origin HEAD:monday-clean-architecture
