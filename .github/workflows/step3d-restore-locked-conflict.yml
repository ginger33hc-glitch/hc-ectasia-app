name: Step 3D restore locked conflict branch
on:
  pull_request:
    branches: [main]
    types: [synchronize]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: monday-clean-architecture
          fetch-depth: 0
      - name: Restore locked canonical conflict handling
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast
          p=Path('app.py')
          t=p.read_text()
          marker='''                if value is None or old == value:\n                    continue\n                if key in planning_conflict_fields:\n'''
          if t.count(marker)!=1:
              raise SystemExit(f'expected one insertion marker, got {t.count(marker)}')
          replacement='''                if value is None or old == value:\n                    continue\n                if key in LOCKED_FIELDS:\n                    target["data_conflicts"].append(f"{key}: {old} vs {value}")\n                    target[key] = None\n                    continue\n                if key in planning_conflict_fields:\n'''
          t=t.replace(marker,replacement,1)
          ast.parse(t)
          p.write_text(t)
          PY
          git diff --check
          python -m py_compile app.py
      - name: Commit locked conflict restoration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py
          git diff --cached --quiet && exit 1
          git commit -m 'Restore locked canonical conflict handling'
          git push origin HEAD:monday-clean-architecture
