name: Step 2A flatten extraction prompt

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  flatten:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: monday-clean-architecture
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Guard and flatten prompt-only source policies
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast

          root = Path('.')
          app_path = root / 'app.py'
          composition_path = root / 'runtime_composition.py'
          app = app_path.read_text(encoding='utf-8')
          composition = composition_path.read_text(encoding='utf-8')

          retired_modules = {'erss_numeric_extraction_policy', 'bad_display_source_policy'}
          allowed = {composition_path, root / 'erss_numeric_extraction_policy.py', root / 'bad_display_source_policy.py'}
          refs = {}
          for path in root.rglob('*.py'):
              if path in allowed or '.git' in path.parts or '.github' in path.parts or 'tests' in path.parts or 'docs' in path.parts:
                  continue
              tree = ast.parse(path.read_text(encoding='utf-8'), filename=str(path))
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      for alias in node.names:
                          if alias.name.split('.')[0] in retired_modules:
                              refs.setdefault(alias.name.split('.')[0], []).append(str(path))
                  elif isinstance(node, ast.ImportFrom) and node.module and node.module.split('.')[0] in retired_modules:
                      refs.setdefault(node.module.split('.')[0], []).append(str(path))
          if refs:
              raise SystemExit(f'ABORT: prompt-only policy modules still have production imports: {refs}')

          start_marker = 'Only the categorical fields that genuinely require map inspection may be produced visually:'
          end_marker = 'For an Excimer Laser Takip Karti, extract treatment_corrections only from the row explicitly labeled'
          start = app.find(start_marker)
          end = app.find(end_marker)
          if start < 0 or end < 0 or end <= start:
              raise SystemExit('ABORT: canonical ERSS prompt replacement markers not found')

          replacement = '''ERSS VISUAL MORPHOLOGY DISABLED:\nGeneral ERSS/Randleman visual morphology classification is disabled. Do not visually score asymmetric\nbow-tie, inferior steepening, keratoconus pattern, forme-fruste pattern, PMD pattern, or any other ERSS\nmorphology category.\n\nERSS SRAX SOURCE LOCK — MODEL ESTIMATION DISABLED:\nSRAX is measured outside the extraction model by CER-AI's deterministic geometric image-analysis\nengine using only the Axial/Sagittal Curvature (Front) map on the Pentacam 4 Maps Refractive page.\nDo not visually estimate SRAX, return a numeric srax_deg from map appearance, or derive SRAX from\nKISA, Kmax, I-S, astigmatism tables, K1/K2/global Axis, BAD values, elevation, pachymetry, or any surrogate.\nFor every image handled by this model, return srax=UNCERTAIN and srax_deg=null. The deterministic\ngeometry layer may replace those values only when the correct Front map and both hemimeridian axes\nare resolved with adequate confidence. General morphology outputs remain morphology=UNCERTAIN,\nmorphology_evidence=[], asymmetric_bow_tie=UNCERTAIN, and inferior_opposite_steepening_D=null.\nAnterior/posterior tomography pattern fields remain separate non-ERSS review inputs.\n\nBELIN/AMBROSIO BAD DISPLAY SOURCE LOCK:\nBAD_D, Df, Db, Dp, Dt, and Da may be transcribed ONLY from the explicitly labeled bottom BAD-D\ncomponent strip on a visible Belin/Ambrosio Display for the same eye. Preserve every printed sign\nexactly. Never derive or reconstruct Df from anterior elevation, Db from B.Ele.Th/posterior elevation,\nDp from PPI, Dt from thinnest pachymetry, Da from ARTmax, or Final D from the component values. Never\nsubstitute a color, map spot, neighboring value, or another screen/eye. If the label, sign, digits, or\nlaterality is unreadable, return null for that field. Final BAD-D remains the printed overall BAD signal.\n\n'''
          app = app[:start] + replacement + app[end:]

          for forbidden in (
              'ERSS VISUAL MORPHOLOGY DISABLED:',
              'BELIN/AMBROSIO BAD DISPLAY SOURCE LOCK:',
          ):
              if app.count(forbidden) != 1:
                  raise SystemExit(f'ABORT: expected one canonical prompt block for {forbidden!r}, found {app.count(forbidden)}')

          for line in (
              'import bad_display_source_policy  # noqa: E402\n',
              'import erss_numeric_extraction_policy  # noqa: E402\n',
              '    erss_numeric_extraction_policy.install(core)\n',
              '    bad_display_source_policy.install(core)\n',
          ):
              if line not in composition:
                  raise SystemExit(f'ABORT: expected composition line not found: {line.strip()}')
              composition = composition.replace(line, '')
          composition = composition.replace('"merge_policy_base", "extraction_guard", "erss_numeric_extraction_policy",\n', '"merge_policy_base", "extraction_guard",\n')
          composition = composition.replace('"rmin_front_source_policy", "geometric_srax_policy", "bad_display_source_policy",\n', '"rmin_front_source_policy", "geometric_srax_policy",\n')
          if 'erss_numeric_extraction_policy' in composition or 'bad_display_source_policy' in composition:
              raise SystemExit('ABORT: retired prompt-only module name survived runtime_composition.py')

          ast.parse(app, filename='app.py')
          ast.parse(composition, filename='runtime_composition.py')
          app_path.write_text(app, encoding='utf-8')
          composition_path.write_text(composition, encoding='utf-8')
          PY
          python -m py_compile app.py runtime_composition.py
          git rm erss_numeric_extraction_policy.py bad_display_source_policy.py
          git diff --check
      - name: Commit Step 2A prompt flattening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py runtime_composition.py
          git commit -m "Flatten canonical extraction prompt policies"
          git push origin HEAD:monday-clean-architecture
