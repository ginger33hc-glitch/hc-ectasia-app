name: Step 3B migrate fallback-era tests

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: monday-clean-architecture
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Migrate fallback-era fixtures
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast
          p = Path('tests/test_reconciliation_behavior_lock.py')
          text = p.read_text()
          assert 'e["map_fallback_numeric_fields"] = [field] if provenance == "fallback" else []' in text
          assert 'test_rmin_map_fallback_is_prohibited_even_with_correct_source_identity' in text
          assert 'test_k1_map_fallback_is_never_accepted' in text

          text = text.replace('        "map_fallback_numeric_fields": [],\n', '', 1)
          text = text.replace(
              'def _numeric_result(filename, field, value, screen, provenance="table", source_id=None):',
              'def _numeric_result(filename, field, value, screen, verified=True, source_id=None):', 1,
          )
          text = text.replace(
              '    e["table_verified_numeric_fields"] = [field] if provenance == "table" else []\n'
              '    e["map_fallback_numeric_fields"] = [field] if provenance == "fallback" else []\n',
              '    e["table_verified_numeric_fields"] = [field] if verified else []\n', 1,
          )
          old1 = '''def test_rmin_map_fallback_is_prohibited_even_with_correct_source_identity():\n    merged = core.merge_extractions([\n        _numeric_result(\n            "show2.jpg", "Rmin_mm", 5.33, "SHOW_2_EXAMS_TOPOMETRIC",\n            "fallback", source_id=SHOW_2_CORNEA_BACK,\n        ),\n    ])\n    od = merged["eyes"][0]\n    assert od["Rmin_mm"] is None\n    assert "Rmin_mm" not in od.get("map_fallback_numeric_fields", [])\n'''
          new1 = '''def test_unverified_rmin_is_rejected_even_with_correct_source_identity():\n    merged = core.merge_extractions([\n        _numeric_result(\n            "show2.jpg", "Rmin_mm", 5.33, "SHOW_2_EXAMS_TOPOMETRIC",\n            verified=False, source_id=SHOW_2_CORNEA_BACK,\n        ),\n    ])\n    od = merged["eyes"][0]\n    assert od["Rmin_mm"] is None\n    assert "Rmin_mm" in od.get("missing_or_unreadable", [])\n'''
          assert old1 in text
          text = text.replace(old1, new1, 1)
          old2 = '''def test_k1_map_fallback_is_never_accepted():\n    merged = core.merge_extractions([\n        _numeric_result(\n            "show2.jpg", "K1_D", 44.6, "SHOW_2_EXAMS_TOPOMETRIC",\n            "fallback", source_id=SHOW_2_CORNEA_FRONT,\n        ),\n    ])\n    od = merged["eyes"][0]\n    assert od["K1_D"] is None\n    assert "K1_D" not in od.get("map_fallback_numeric_fields", [])\n'''
          new2 = '''def test_unverified_k1_is_never_accepted_even_with_source_identity():\n    merged = core.merge_extractions([\n        _numeric_result(\n            "show2.jpg", "K1_D", 44.6, "SHOW_2_EXAMS_TOPOMETRIC",\n            verified=False, source_id=SHOW_2_CORNEA_FRONT,\n        ),\n    ])\n    od = merged["eyes"][0]\n    assert od["K1_D"] is None\n    assert "K1_D" in od.get("missing_or_unreadable", [])\n'''
          assert old2 in text
          text = text.replace(old2, new2, 1)
          ast.parse(text)
          assert 'map_fallback_numeric_fields' not in text
          p.write_text(text)
          PY
      - name: Commit test migration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/test_reconciliation_behavior_lock.py
          git commit -m "Migrate obsolete fallback fixtures"
          git push origin HEAD:monday-clean-architecture
