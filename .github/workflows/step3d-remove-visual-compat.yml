# trigger: execute Step 3D guarded migration
name: Step 3D remove visual compatibility
on:
  pull_request:
    branches: [main]
    types: [synchronize]
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: monday-clean-architecture
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Remove retired visual extraction and merge path
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast, re

          app = Path('app.py')
          text = app.read_text()
          required_markers = [
              '"morphology_evidence"', '"asymmetric_bow_tie"',
              '"inferior_opposite_steepening_D"', '"anterior_pattern"', '"posterior_pattern"',
              'morphology_rank = {', 'posterior_rank = {'
          ]
          missing = [m for m in required_markers if m not in text]
          if missing:
              raise SystemExit(f'app.py drift; missing markers: {missing}')

          patterns = [
              r'\n\s*"morphology": \{"type": "string", "enum": list\(MORPHOLOGY\)\},',
              r'\n\s*"morphology_evidence": \{"type": "array", "items": \{"type": "string"\}\},',
              r'\n\s*"asymmetric_bow_tie": \{"type": "string", "enum": \["YES", "NO", "UNCERTAIN"\]\},',
              r'\n\s*"inferior_opposite_steepening_D": \{"type": \["number", "null"\]\},',
              r'\n\s*"anterior_pattern": \{\n\s*"type": "string",\n\s*"enum": \["REASSURING", "BORDERLINE", "ABNORMAL", "UNREADABLE"\],\n\s*\},',
              r'\n\s*"posterior_pattern": \{\n\s*"type": "string",\n\s*"enum": \["REASSURING", "BORDERLINE", "ABNORMAL", "UNREADABLE"\],\n\s*\},',
          ]
          for p in patterns:
              text, n = re.subn(p, '', text)
              if n != 1:
                  raise SystemExit(f'expected exactly one schema removal for {p!r}, got {n}')

          text = text.replace('                    "morphology",\n                    "morphology_evidence", "asymmetric_bow_tie", "srax", "srax_deg",\n                    "inferior_opposite_steepening_D",\n                    "anterior_pattern", "posterior_pattern",\n', '                    "srax", "srax_deg",\n')
          text = text.replace('General morphology outputs remain morphology=UNCERTAIN,\nmorphology_evidence=[], asymmetric_bow_tie=UNCERTAIN, and inferior_opposite_steepening_D=null.\n', '')
          text = re.sub(r'\n\s*"srax_deg": "max", "inferior_opposite_steepening_D": "max",', '\n        "srax_deg": "max",', text)
          text = re.sub(r'\n\s*morphology_rank = \{.*?\n\s*\}\n', '\n', text, count=1, flags=re.S)
          text = re.sub(r'\n\s*posterior_rank = \{"UNREADABLE": 0, "REASSURING": 1, "BORDERLINE": 2, "ABNORMAL": 3\}\n', '\n', text, count=1)
          text = re.sub(r'\n\s*for field in \("morphology", "anterior_pattern", "posterior_pattern", "asymmetric_bow_tie", "srax"\):\n\s*if eye\.get\(field\) is not None:\n\s*eye\["field_provenance"\]\[field\] = \[\{"file": source_filename, "source": "VISUAL_CLASSIFICATION"\}\]\n', '\n', text, count=1)
          text = re.sub(r'\n\s*target\["morphology_evidence"\] = list\(\n\s*dict\.fromkeys\(target\.get\("morphology_evidence", \[\]\) \+ eye\.get\("morphology_evidence", \[\]\)\)\n\s*\)\n', '\n', text, count=1)
          text = text.replace('                    "morphology_evidence", "source_files", "quality_by_source", "_source_filename",\n', '                    "source_files", "quality_by_source", "_source_filename",\n')
          text = re.sub(r'\n\s*# Missing/uncertain information on a page that lacks the relevant map is not\n\s*# contradictory evidence against a readable observation on another page\.\n\s*if key == "morphology":.*?\n\s*if key in planning_conflict_fields:', '\n                if key in planning_conflict_fields:', text, count=1, flags=re.S)
          text = re.sub(r'\n\s*elif key == "morphology":.*?\n\s*elif old != value:', '\n                elif old != value:', text, count=1, flags=re.S)

          ast.parse(text)
          app.write_text(text)

          geo = Path('geometric_srax_policy.py')
          g = geo.read_text()
          old = '''    eye.setdefault("morphology_evidence", []).append(\n        "Deterministic Front-map SRAX geometry "\n        f"({ALGORITHM_VERSION}): superior axis {measurement['superior_axis_deg']:.1f}°, "\n        f"inferior axis {measurement['inferior_axis_deg']:.1f}°, "\n        f"SRAX {measurement['srax_deg']:.1f}°; strict >20° criterion."\n    )\n'''
          if old not in g:
              raise SystemExit('geometric SRAX morphology evidence block drifted')
          g = g.replace(old, '')
          ast.parse(g)
          geo.write_text(g)

          for path in ('inter_eye_tomography.py', 'tests/test_inter_eye_tomography.py'):
              p = Path(path)
              if not p.exists():
                  raise SystemExit(f'missing expected legacy path {path}')
              p.unlink()

          t = Path('tests/test_phase4_cleanup_contract.py').read_text()
          marker = '    assert "numeric_tolerance" not in text\n'
          if marker not in t:
              raise SystemExit('cleanup contract insertion marker missing')
          addition = marker + '    for retired in ("morphology_rank", "posterior_rank", "inferior_opposite_steepening_D", "anterior_pattern", "posterior_pattern", "asymmetric_bow_tie", "morphology_evidence"):\n        assert retired not in text\n'
          t = t.replace(marker, addition, 1)
          ast.parse(t)
          Path('tests/test_phase4_cleanup_contract.py').write_text(t)

          for p in ('app.py','geometric_srax_policy.py','tests/test_phase4_cleanup_contract.py'):
              ast.parse(Path(p).read_text())
          PY
          git diff --check
          python -m py_compile app.py geometric_srax_policy.py
      - name: Commit Step 3D cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py geometric_srax_policy.py tests/test_phase4_cleanup_contract.py inter_eye_tomography.py tests/test_inter_eye_tomography.py
          git diff --cached --quiet && exit 1
          git commit -m 'Remove retired visual morphology compatibility path'
          git push origin HEAD:monday-clean-architecture
