name: Step 2G retire legacy clinical app logic

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  retire:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: monday-clean-architecture
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Guard and retire duplicate clinical functions
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast

          app_path = Path('app.py')
          app = app_path.read_text()
          tree = ast.parse(app)
          retired = {
              'bad_classification', 'lasik_topography_points', 'scoring_morphology',
              'lasik_rsb_points', 'age_points', 'lasik_pachy_points', 'lasik_mrse_points',
              'prk_morphology_points', 'prk_pachy_points', 'score_category', 'tomography_review',
              'estimate_ablation', 'refractive_pattern', 'required_tomography_missing',
          }
          found = {
              node.name: node for node in tree.body
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)) and node.name in retired
          }
          missing = retired - found.keys()
          assert not missing, f'missing guarded legacy functions: {sorted(missing)}'

          # Remove the active merge-side morphology reinterpretation first.
          legacy_merge = '''        derived = scoring_morphology(eye)["category"]\n        eye["scoring_morphology"] = derived\n        if eye.get("morphology") in ("ASYMMETRIC_BOWTIE", "INFERIOR_STEEPENING_SRA") and derived == "UNCERTAIN":\n            eye["morphology"] = "UNCERTAIN"\n        if eye.get("asymmetric_bow_tie") == "YES" and derived != "ASYMMETRIC_BOWTIE":\n            eye["asymmetric_bow_tie"] = "UNCERTAIN"\n        if eye.get("srax") == "YES" and derived != "INFERIOR_STEEPENING_SRA":\n            eye["srax"] = "UNCERTAIN"\n'''
          assert legacy_merge in app
          app = app.replace(legacy_merge, '', 1)

          # Reparse, then delete all retired top-level clinical implementations by exact AST spans.
          tree = ast.parse(app)
          lines = app.splitlines(keepends=True)
          spans = []
          for node in tree.body:
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)) and node.name in retired:
                  spans.append((node.lineno - 1, node.end_lineno, node.name))
          assert {name for _, _, name in spans} == retired
          for start, end, _name in sorted(spans, reverse=True):
              del lines[start:end]
          app = ''.join(lines)
          ast.parse(app)
          app_path.write_text(app)

          # Canonical pipeline test must no longer compare against deleted app duplicates.
          pipeline_path = Path('tests/test_clinical_core_pipeline.py')
          pipeline = pipeline_path.read_text()
          old_test = '''def test_erss_rsb_and_mrse_points_match_current_production_functions():\n    from clinical_core.erss import erss_mrse_points, erss_rsb_points\n    rsb_values = (239.999, 240, 260, 280, 300)\n    mrse_values = (-14.001, -14, -12, -10, -8)\n    assert [erss_rsb_points(v) for v in rsb_values] == [core.lasik_rsb_points(v) for v in rsb_values]\n    assert [erss_mrse_points(v) for v in mrse_values] == [core.lasik_mrse_points(v) for v in mrse_values]\n'''
          new_test = '''def test_erss_rsb_and_mrse_boundary_contract_is_canonical():\n    from clinical_core.erss import erss_mrse_points, erss_rsb_points\n    rsb_values = (239.999, 240, 259.999, 260, 279.999, 280, 299.999, 300)\n    mrse_values = (-14.001, -14, -12.001, -12, -10.001, -10, -8.001, -8)\n    assert [erss_rsb_points(v) for v in rsb_values] == [4, 3, 3, 2, 2, 1, 1, 0]\n    assert [erss_mrse_points(v) for v in mrse_values] == [4, 3, 3, 2, 2, 1, 1, 0]\n'''
          assert old_test in pipeline
          pipeline = pipeline.replace(old_test, new_test, 1)
          ast.parse(pipeline)
          pipeline_path.write_text(pipeline)

          # Replace obsolete BAD review tests with the canonical Final-D-only contract.
          bad_test = '''import importlib\nfrom pathlib import Path\n\nfrom clinical_core.bad import BADContext, evaluate_bad\n\n\ndef test_bad_display_prompt_is_source_locked_directly_in_canonical_extractor():\n    runtime = importlib.import_module("canonical_engine")\n    prompt = runtime.core.PROMPT\n    assert "BELIN/AMBROSIO BAD DISPLAY SOURCE LOCK" in prompt\n    assert "Preserve every printed sign" in prompt\n    assert "Never derive or reconstruct Df from anterior elevation" in prompt\n    assert "Dt from thinnest pachymetry" in prompt\n    assert "Da from ARTmax" in prompt\n    assert "Final D from the component values" in prompt\n    assert not hasattr(runtime.core, "_cerai_bad_display_source_lock_installed")\n    assert not Path("bad_display_source_policy.py").exists()\n\n\ndef test_normal_final_bad_d_remains_normal_despite_adjunctive_component_flags():\n    result = evaluate_bad(0.83, context=BADContext(\n        df=-1.01, db=-0.58, dp=1.05, dt=-0.10, da=0.70, artmax_um=400\n    ))\n    assert result.classification == "NORMAL"\n    assert result.final_d == 0.83\n    assert result.context.artmax_um == 400\n    assert result.context.dt == -0.10\n    assert result.context.da == 0.70\n\n\ndef test_bad_decision_is_owned_by_final_d_not_visual_map_patterns():\n    normal = evaluate_bad(0.83, context=BADContext(df=-1.01, db=-0.58, dp=1.05, dt=-0.65, da=0.38))\n    suspicious = evaluate_bad(1.61)\n    abnormal = evaluate_bad(2.60)\n    assert normal.classification == "NORMAL"\n    assert suspicious.classification == "SUSPICIOUS"\n    assert abnormal.classification == "ABNORMAL"\n'''
          Path('tests/test_bad_display_source_policy.py').write_text(bad_test)
          ast.parse(bad_test)

          # Strengthen cleanup contract so duplicate app clinical logic cannot return.
          cleanup_path = Path('tests/test_phase4_cleanup_contract.py')
          cleanup = cleanup_path.read_text()
          needle = '''    assert "def merge_extractions(" in text\n'''
          addition = '''    assert "def merge_extractions(" in text\n    retired_helpers = {\n        "bad_classification", "lasik_topography_points", "scoring_morphology",\n        "lasik_rsb_points", "age_points", "lasik_pachy_points", "lasik_mrse_points",\n        "prk_morphology_points", "prk_pachy_points", "score_category", "tomography_review",\n        "estimate_ablation", "refractive_pattern", "required_tomography_missing",\n    }\n    assert retired_helpers.isdisjoint(top_level_functions)\n'''
          assert needle in cleanup
          cleanup = cleanup.replace(needle, addition, 1)
          ast.parse(cleanup)
          cleanup_path.write_text(cleanup)

          # No hidden morphology/scoring rewrite may remain in canonical merge.
          final_app = app_path.read_text()
          for token in ('scoring_morphology(', 'tomography_review(', 'required_tomography_missing('):
              assert token not in final_app
          PY
      - name: Commit legacy clinical retirement
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app.py tests/test_clinical_core_pipeline.py tests/test_bad_display_source_policy.py tests/test_phase4_cleanup_contract.py
          git commit -m "Retire duplicate legacy clinical logic from app"
          git push origin HEAD:monday-clean-architecture
