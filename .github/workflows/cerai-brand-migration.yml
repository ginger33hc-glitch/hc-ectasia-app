name: CER-AI brand verification

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify-brand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject legacy or incorrect product branding
        shell: python
        run: |
          import re
          from pathlib import Path

          root = Path('.')
          workflow = Path('.github/workflows/cerai-brand-migration.yml')
          text_suffixes = {
              '.py', '.html', '.js', '.css', '.md', '.txt', '.json',
              '.yml', '.yaml', '.toml', '.ini', '.cfg', '.webmanifest',
          }
          forbidden = (
              'HC Ectasia App',
              'HC Ectasia Assessment',
              'Corneal Refractive Analysis Intelligence',
          )
          # Historical product names are permitted only where the public website
          # explicitly documents the project's evolution, plus its regression test.
          historical_branding_paths = {
              Path('static/public-home.html'),
              Path('tests/test_public_site.py'),
          }
          # Preserve this pre-existing wire-protocol header until all deployed clients have moved
          # to named-user sessions. It is a technical compatibility identifier, not product branding.
          technical_compatibility_identifiers = (
              'X-CERAI-Access-Key',
          )

          failures = []
          for path in root.rglob('*'):
              if not path.is_file() or '.git' in path.parts or path == workflow:
                  continue
              if path.suffix.lower() not in text_suffixes and path.name != 'Dockerfile':
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue

              allows_history = path in historical_branding_paths
              for phrase in forbidden:
                  if phrase in text and not (allows_history and phrase in {'HC Ectasia App'}):
                      failures.append(f'{path}: {phrase}')

              brand_text = text
              for identifier in technical_compatibility_identifiers:
                  brand_text = brand_text.replace(identifier, '')
              if not allows_history and re.search(r'CERAI(?!_)', brand_text):
                  failures.append(f'{path}: legacy CERAI spelling')

          if failures:
              raise SystemExit('Legacy or incorrect branding found:\n' + '\n'.join(failures))
          print('CER-AI branding verification passed.')
