name: CER-AI brand verification

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify-brand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject legacy or incorrect product branding
        shell: python
        run: |
          import re
          from pathlib import Path

          root = Path('.')
          workflow = Path('.github/workflows/cerai-brand-migration.yml')
          text_suffixes = {
              '.py', '.html', '.js', '.css', '.md', '.txt', '.json',
              '.yml', '.yaml', '.toml', '.ini', '.cfg', '.webmanifest',
          }
          forbidden = (
              'HC Ectasia App',
              'HC Ectasia Assessment',
              'Corneal Refractive Analysis Intelligence',
          )

          failures = []
          for path in root.rglob('*'):
              if not path.is_file() or '.git' in path.parts or path == workflow:
                  continue
              if path.suffix.lower() not in text_suffixes and path.name != 'Dockerfile':
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              for phrase in forbidden:
                  if phrase in text:
                      failures.append(f'{path}: {phrase}')
              if re.search(r'CERAI(?!_)', text):
                  failures.append(f'{path}: legacy CERAI spelling')

          if failures:
              raise SystemExit('Legacy or incorrect branding found:\n' + '\n'.join(failures))
          print('CER-AI branding verification passed.')
