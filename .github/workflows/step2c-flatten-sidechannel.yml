name: Step 2C flatten NICE PS3 extraction sidechannel

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  flatten:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: monday-clean-architecture
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Guard and flatten extraction sidechannel
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast

          root = Path('.')
          app_path = root / 'app.py'
          reread_path = root / 'pentacam_targeted_reread.py'
          mandatory_path = root / 'mandatory_source_set_policy.py'
          composition_path = root / 'runtime_composition.py'

          app = app_path.read_text(encoding='utf-8')
          reread = reread_path.read_text(encoding='utf-8')
          mandatory = mandatory_path.read_text(encoding='utf-8')
          composition = composition_path.read_text(encoding='utf-8')

          promoted = (
              'central_pachy_um', 'B_Ele_Th_um', 'F_Ele_Th_um', 'posterior_Kmean_D',
              'topographic_astig_D', 'topographic_steep_axis_deg', 'topometric_RMin', 'TKC',
          )

          # Base extraction schema owns every canonical field directly.
          table_marker = '    "total_RMS_um", "spherical_aberration_um",\n)'
          table_replacement = (
              '    "total_RMS_um", "spherical_aberration_um",\n'
              '    "central_pachy_um", "B_Ele_Th_um", "F_Ele_Th_um", "posterior_Kmean_D",\n'
              '    "topographic_astig_D", "topographic_steep_axis_deg", "topometric_RMin", "TKC",\n'
              ')'
          )
          if app.count(table_marker) != 1:
              raise SystemExit(f'ABORT: TABLE_NUMERIC_FIELDS marker count={app.count(table_marker)}')
          app = app.replace(table_marker, table_replacement, 1)

          props_marker = '                    "Kmax_D": {"type": ["number", "null"]},\n'
          props_insert = (
              props_marker
              + '                    "central_pachy_um": {"type": ["number", "null"]},\n'
              + '                    "B_Ele_Th_um": {"type": ["number", "null"]},\n'
              + '                    "F_Ele_Th_um": {"type": ["number", "null"]},\n'
              + '                    "posterior_Kmean_D": {"type": ["number", "null"]},\n'
              + '                    "topographic_astig_D": {"type": ["number", "null"]},\n'
              + '                    "topographic_steep_axis_deg": {"type": ["number", "null"]},\n'
              + '                    "topometric_RMin": {"type": ["number", "null"]},\n'
              + '                    "TKC": {"type": ["number", "null"]},\n'
          )
          if app.count(props_marker) != 1:
              raise SystemExit(f'ABORT: schema property marker count={app.count(props_marker)}')
          app = app.replace(props_marker, props_insert, 1)

          required_marker = '                    "total_RMS_um", "spherical_aberration_um", "morphology",\n'
          required_replacement = (
              '                    "total_RMS_um", "spherical_aberration_um",\n'
              '                    "central_pachy_um", "B_Ele_Th_um", "F_Ele_Th_um", "posterior_Kmean_D",\n'
              '                    "topographic_astig_D", "topographic_steep_axis_deg", "topometric_RMin", "TKC",\n'
              '                    "morphology",\n'
          )
          if app.count(required_marker) != 1:
              raise SystemExit(f'ABORT: schema required marker count={app.count(required_marker)}')
          app = app.replace(required_marker, required_replacement, 1)

          prompt_marker = '- Kmax_D: use only the numeric value in the explicitly printed "KMax"/"Kmax" row.\n'
          prompt_insert = (
              '- central_pachy_um: use only 4 Maps Refractive lower-left Pupil Center (+) pachymetry.\n'
              '- B_Ele_Th_um and F_Ele_Th_um: use only the BAD Display central labeled B.Ele.Th/F.Ele.Th boxes.\n'
              '- posterior_Kmean_D: use only Show 2 Exams Topometric -> Cornea Back -> printed Km.\n'
              '- topographic_astig_D and topographic_steep_axis_deg: use only Show 2 Exams Topometric -> Cornea Front.\n'
              '- topometric_RMin and TKC: use only Show 2 Exams Topometric center Indices (in 8 mm zone).\n'
              + prompt_marker
          )
          if app.count(prompt_marker) != 1:
              raise SystemExit(f'ABORT: prompt marker count={app.count(prompt_marker)}')
          app = app.replace(prompt_marker, prompt_insert, 1)

          # Targeted reread no longer consults or writes the NICE side-channel.
          start = reread.find('        central_present = any(')
          end = reread.find('        missing = [', start)
          if start < 0 or end < 0:
              raise SystemExit('ABORT: NICE side-channel presence block not found')
          reread = reread[:start] + reread[end:]
          old_missing = '''        missing = [\n            field for field in TARGET_FIELDS\n            if not (field == "central_pachy_um" and central_present)\n            and not (field == "B_Ele_Th_um" and b_ele_th_present)\n            and not (\n'''
          new_missing = '''        missing = [\n            field for field in TARGET_FIELDS\n            if not (\n'''
          if old_missing in reread:
              reread = reread.replace(old_missing, new_missing, 1)
          elif 'central_present' in reread or 'b_ele_th_present' in reread:
              raise SystemExit('ABORT: residual NICE side-channel presence logic remains')

          old_guard = '        if eye is None or (field not in {"central_pachy_um", "B_Ele_Th_um"} and eye.get(field) is not None):\n'
          new_guard = '        if eye is None or eye.get(field) is not None:\n'
          if reread.count(old_guard) != 1:
              raise SystemExit(f'ABORT: apply guard count={reread.count(old_guard)}')
          reread = reread.replace(old_guard, new_guard, 1)

          branch_start = reread.find('        if field in {"central_pachy_um", "B_Ele_Th_um"}:')
          branch_end = reread.find('        eye["missing_or_unreadable"] = [', branch_start)
          if branch_start < 0 or branch_end < 0:
              raise SystemExit('ABORT: targeted NICE-write branch not found')
          direct_write = '''        eye[field] = retained\n        if field in CORNEA_FRONT_KERATOMETRY_FIELDS:\n            eye["keratometry_source"] = CORNEA_FRONT_KERATOMETRY_SOURCE\n        verified = set(eye.get("table_verified_numeric_fields") or [])\n        verified.add(field)\n        eye["table_verified_numeric_fields"] = sorted(verified)\n        source_id = canonical_source_id(field)\n        if source_id:\n            eye.setdefault("canonical_source_ids", {})[field] = source_id\n'''
          reread = reread[:branch_start] + direct_write + reread[branch_end:]
          if 'result.setdefault("nice_readings"' in reread:
              raise SystemExit('ABORT: nice_readings writer survived targeted reread')

          # Mandatory-source recognition uses canonical screen/field evidence only.
          nice_signature = '''    for reading in result.get("nice_readings") or []:\n        if reading.get("b_ele_th_page") == "BAD_DISPLAY":\n            return True\n'''
          if mandatory.count(nice_signature) != 1:
              raise SystemExit(f'ABORT: mandatory nice_readings signature count={mandatory.count(nice_signature)}')
          mandatory = mandatory.replace(nice_signature, '', 1)
          if 'nice_readings' in mandatory:
              raise SystemExit('ABORT: nice_readings survived mandatory source policy')

          # Runtime composition no longer installs the PS3 extraction/merge wrapper.
          for line in (
              'import ps3_extraction_policy  # noqa: E402\n',
              '    ps3_extraction_policy.install(core)\n',
          ):
              if composition.count(line) != 1:
                  raise SystemExit(f'ABORT: composition line count for {line.strip()}={composition.count(line)}')
              composition = composition.replace(line, '', 1)
          composition = composition.replace('        "ps3_extraction_policy",\n', '', 1)
          if 'ps3_extraction_policy' in composition:
              raise SystemExit('ABORT: PS3 extraction wrapper name survived composition')

          # Validate promoted fields are uniquely present in base schema/TABLE ownership.
          for field in promoted:
              if field not in app:
                  raise SystemExit(f'ABORT: promoted field missing from app: {field}')

          for text, name in ((app, 'app.py'), (reread, 'pentacam_targeted_reread.py'),
                             (mandatory, 'mandatory_source_set_policy.py'),
                             (composition, 'runtime_composition.py')):
              ast.parse(text, filename=name)

          app_path.write_text(app, encoding='utf-8')
          reread_path.write_text(reread, encoding='utf-8')
          mandatory_path.write_text(mandatory, encoding='utf-8')
          composition_path.write_text(composition, encoding='utf-8')
          PY
          python -m py_compile app.py pentacam_targeted_reread.py mandatory_source_set_policy.py runtime_composition.py
          git rm ps3_extraction_policy.py
          git diff --check
      - name: Commit Step 2C sidechannel flattening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py pentacam_targeted_reread.py mandatory_source_set_policy.py runtime_composition.py
          git commit -m "Flatten NICE and PS3 extraction sidechannel"
          git push origin HEAD:monday-clean-architecture
