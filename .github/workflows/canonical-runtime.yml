name: Canonical Runtime Safety

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  canonical-runtime:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install dependencies
        run: pip install --require-hashes -r requirements-dev.txt
      - name: Critical static checks
        run: ruff check --select E9,F63,F7,F82 .
      - name: Compile decision-critical runtime modules
        run: python -m py_compile app.py runtime_composition.py canonical_readiness.py clinical_eligibility.py canonical_input_adapter.py canonical_runtime_service.py public_site.py analysis_job_service.py exam_date_reconciliation_policy.py pentacam_field_registry.py pentacam_canonical_source_lock.py pentacam_provenance.py mandatory_source_set_policy.py geometric_srax_policy.py ps3_policy.py astigmatic_disparity_policy.py user_access.py named_user_ui.py operational_security.py assessment_workflow.py case_archive.py archive_privacy.py archive_migration.py audit_log.py case_catalog.py historical_report.py research_export.py scripts/verify_case_archive.py scripts/verify_railway_archive_config.py scripts/migrate_case_archive.py scripts/generate_user_password_hash.py scripts/generate_research_pseudonym_key.py extraction_guard.py planning/microkeratome.py canonical_engine.py reports.py clinical_core/__init__.py clinical_core/bad.py clinical_core/rules.py clinical_core/erss.py clinical_core/nice.py clinical_core/disposition.py clinical_core/ps3.py clinical_core/safety.py clinical_core/planning.py clinical_core/refraction.py clinical_core/report_payload.py clinical_core/pipeline.py clinical_core/readiness.py clinical_core/version.py
      - name: Canonical startup invariants
        env:
          OPENAI_API_KEY: test-key-for-import-only
        run: python -c "import canonical_engine; assert canonical_engine.runtime_invariants()"
      - name: Complete application regression suite
        env:
          OPENAI_API_KEY: test-key-for-import-only
        run: python -m pytest -q

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install audit dependencies
        run: pip install --require-hashes -r requirements-dev.txt
      - name: Audit production dependencies
        run: pip-audit -r requirements.txt
      - name: Audit development dependencies
        run: pip-audit -r requirements-dev.txt
