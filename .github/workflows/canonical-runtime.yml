name: Canonical Runtime Safety

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  canonical-runtime:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Audit production dependencies
        run: pip-audit -r requirements.txt
      - name: Critical static checks
        run: ruff check --select E9,F63,F7,F82 .
      - name: Compile decision-critical runtime modules
        run: python -m py_compile app.py bootstrap.py runtime_composition.py pentacam_field_registry.py derived_srax.py ps3_policy.py ps3_extraction_policy.py ps3_runtime_policy.py ps3_report_policy.py user_access.py named_user_ui.py operational_security.py assessment_workflow.py case_archive.py archive_migration.py audit_log.py case_catalog.py historical_report.py research_export.py scripts/verify_case_archive.py scripts/verify_railway_archive_config.py scripts/migrate_case_archive.py scripts/generate_user_password_hash.py scripts/generate_research_pseudonym_key.py hc_age_policy.py hc_bad_final_policy.py lasik_planning.py merge_policy_base.py extraction_guard.py erss_topography_guard.py randleman_bad_independence.py erss_visual_morphology_policy.py critical_score_highlight.py pachymetry_policy.py hc_final_decision_policy.py status_rank_policy.py inter_eye_tomography.py inter_eye_tomography_policy.py planning/microkeratome.py microkeratome_planning_policy.py canonical_engine.py reports.py report_export_guard.py clean_engine/policy.py clean_engine/decision.py clean_engine/surgery.py clean_engine/reconciliation.py clean_engine/input_adapter.py clean_engine/report_model.py clean_engine/service.py clean_engine/migration.py clean_engine/models.py clean_engine/engine.py clean_engine/status.py clean_engine/ablation.py clean_engine/prk.py clean_engine/hard_stops.py clean_engine/validation.py clean_engine/scoring.py clean_engine/calculation.py clean_engine/finalization.py clean_engine/microkeratome_planning.py clean_engine/__init__.py
      - name: Canonical startup invariants
        env:
          OPENAI_API_KEY: test-key-for-import-only
        run: python -c "import canonical_engine; assert canonical_engine.runtime_invariants()"
      - name: Archive, Railway preflight, migration, catalog, audit, user, UI, historical-report, and research security tests
        env:
          OPENAI_API_KEY: test-key-for-import-only
        run: python -m pytest -q tests/test_case_archive.py tests/test_railway_archive_preflight.py tests/test_archive_migration.py tests/test_case_catalog.py tests/test_audit_log.py tests/test_user_access.py tests/test_named_user_ui.py tests/test_historical_report.py tests/test_research_export.py tests/test_operational_security.py
      - name: Behavior-lock, equivalence, and clinical regression tests
        env:
          OPENAI_API_KEY: test-key-for-import-only
        run: python -m pytest -q tests/test_behavior_lock_v0743.py tests/test_inter_eye_tomography.py tests/test_microkeratome_planning.py tests/test_microkeratome_runtime_policy.py tests/test_reconciliation_behavior_lock.py tests/test_surgical_policy_lock.py tests/test_erss_runtime.py tests/test_clean_policy_equivalence.py tests/test_clean_decision_surgery.py tests/test_clean_reconciliation.py tests/test_clean_engine_pipeline.py tests/test_clean_status_equivalence.py tests/test_clean_ablation_equivalence.py tests/test_clean_prk_characterization.py tests/test_clean_prk_equivalence.py tests/test_clean_hard_stops.py tests/test_clean_validation.py tests/test_clean_scoring.py tests/test_clean_calculation.py tests/test_clean_finalization.py tests/test_clean_architecture.py tests/test_clean_public_api.py tests/test_clean_end_to_end_equivalence.py tests/test_clean_input_adapter.py tests/test_clean_report_model.py tests/test_clean_service.py tests/test_clean_migration_seam.py tests/test_clean_production_isolation.py
      - name: Complete application regression suite
        env:
          OPENAI_API_KEY: test-key-for-import-only
        run: python -m pytest -q
      - name: Test files are independent of import order
        env:
          OPENAI_API_KEY: test-key-for-import-only
        shell: bash
        run: |
          for test_file in tests/test_*.py; do
            python -m pytest -q "$test_file"
          done
