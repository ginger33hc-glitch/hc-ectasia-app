name: Canonical Runtime Safety

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  canonical-runtime:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Audit production dependencies
        run: pip-audit -r requirements.txt
      - name: Critical static checks
        run: ruff check --select E9,F63,F7,F82 .
      - name: Compile decision-critical runtime modules
        run: python -m py_compile app.py bootstrap.py runtime_composition.py canonical_readiness.py clinical_eligibility.py canonical_input_adapter.py canonical_runtime_service.py public_site.py exam_date_reconciliation_policy.py rmin_front_source_policy.py pentacam_field_registry.py pentacam_canonical_source_lock.py pentacam_canonical_source_enforcement.py pentacam_provenance.py erss_numeric_extraction_policy.py mandatory_source_set_policy.py ps3_policy.py ps3_extraction_policy.py ps3_report_policy.py microkeratome_report_policy.py user_access.py named_user_ui.py operational_security.py assessment_workflow.py case_archive.py archive_migration.py audit_log.py case_catalog.py historical_report.py research_export.py scripts/verify_case_archive.py scripts/verify_railway_archive_config.py scripts/migrate_case_archive.py scripts/generate_user_password_hash.py scripts/generate_research_pseudonym_key.py merge_policy_base.py extraction_guard.py critical_score_highlight.py planning/microkeratome.py canonical_engine.py reports.py report_export_guard.py clinical_core/__init__.py clinical_core/bad.py clinical_core/rules.py clinical_core/erss.py clinical_core/nice.py clinical_core/disposition.py clinical_core/ps3.py clinical_core/safety.py clinical_core/planning.py clinical_core/refraction.py clinical_core/report_payload.py clinical_core/pipeline.py clinical_core/readiness.py clinical_core/version.py
      - name: Canonical startup invariants
        env:
          OPENAI_API_KEY: test-key-for-import-only
        run: python -c "import canonical_engine; assert canonical_engine.runtime_invariants()"
      - name: Phase 1 launch behavior contract
        env:
          OPENAI_API_KEY: test-key-for-import-only
        run: python -m pytest -q tests/test_launch_behavior_contract.py
      - name: Phase 2 canonical clinical core, readiness, eligibility, source registry, provenance, and boundary contract
        env:
          OPENAI_API_KEY: test-key-for-import-only
        run: python -m pytest -q tests/test_canonical_readiness.py tests/test_clinical_eligibility.py tests/test_clinical_eligibility_integration.py tests/test_clinical_core_equivalence.py tests/test_clinical_core_bad.py tests/test_clinical_core_nice_disposition_equivalence.py tests/test_clinical_core_ps3_safety_equivalence.py tests/test_clinical_core_planning_equivalence.py tests/test_clinical_core_refraction.py tests/test_clinical_core_pipeline.py tests/test_clinical_core_shadow_equivalence.py tests/test_clinical_core_report_payload.py tests/test_clinical_core_readiness_equivalence.py tests/test_pentacam_canonical_source_lock.py tests/test_pentacam_provenance.py tests/test_phase2_boundary_contract.py
      - name: Phase 3 direct canonical input, runtime, and workflow boundary
        env:
          OPENAI_API_KEY: test-key-for-import-only
        run: python -m pytest -q tests/test_canonical_input_adapter.py tests/test_canonical_ex500_resolution.py tests/test_canonical_runtime_service.py tests/test_canonical_workflow_cutover.py tests/test_canonical_workflow_cutover_contract.py
      - name: Phase 4 cleanup contract
        env:
          OPENAI_API_KEY: test-key-for-import-only
        run: python -m pytest -q tests/test_phase4_cleanup_contract.py
      - name: Archive, Railway preflight, migration, catalog, audit, user, UI, historical-report, research security, and public site tests
        env:
          OPENAI_API_KEY: test-key-for-import-only
        run: python -m pytest -q tests/test_case_archive.py tests/test_railway_archive_preflight.py tests/test_archive_migration.py tests/test_case_catalog.py tests/test_audit_log.py tests/test_user_access.py tests/test_named_user_ui.py tests/test_historical_report.py tests/test_research_export.py tests/test_operational_security.py tests/test_public_site.py
      - name: Behavior-lock, equivalence, and clinical regression tests
        env:
          OPENAI_API_KEY: test-key-for-import-only
        run: python -m pytest -q tests/test_behavior_lock_v0743.py tests/test_inter_eye_tomography.py tests/test_microkeratome_planning.py tests/test_microkeratome_report_policy.py tests/test_reconciliation_behavior_lock.py tests/test_exam_date_reconciliation_policy.py tests/test_rmin_front_source_policy.py tests/test_erss_runtime.py tests/test_mandatory_source_set_policy.py tests/test_ps3_report_policy.py tests/test_negative_is_boundary.py tests/test_contact_lens_washout_gate.py
      - name: Complete application regression suite
        env:
          OPENAI_API_KEY: test-key-for-import-only
        run: python -m pytest -q
      - name: Test files are independent of import order
        if: ${{ always() }}
        env:
          OPENAI_API_KEY: test-key-for-import-only
        shell: bash
        run: |
          for test_file in tests/test_*.py; do
            python -m pytest -q "$test_file"
          done
